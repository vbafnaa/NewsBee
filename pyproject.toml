[project]
name = "newsbee"
version = "0.1.0"
description = "Newsbee local prototype infrastructure"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "pydantic>=2.12,<2.13",
    "pydantic-settings>=2.8,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not browser and not live'"
markers = [
    "browser: requires installed Playwright Chromium",
    "live: requires explicitly configured local services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
