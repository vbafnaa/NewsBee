<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" role="img" aria-labelledby="hybrid-title hybrid-desc"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243146}.heading{font-size:22px;font-weight:700}.title{font-size:18px;font-weight:700}.sub{font-size:15px}.small{font-size:14px;fill:#54657b}.box{fill:white;stroke:#91a3ba;stroke-width:1.5}.store{fill:#fffaf0;stroke:#c79b45;stroke-width:1.5;stroke-dasharray:6 4}.edge{fill:none;stroke:#526984;stroke-width:2;marker-end:url(#arrow1)}.control{stroke-dasharray:6 4}</style>
<title id="hybrid-title">Stage 2: local production with cloud public services</title><desc id="hybrid-desc">Local source agents and editorial workers use local evidence and optionally hosted models. They push approved releases to cloud publishing. Cloud-hosted sites, public intake, subscriptions and email remain available when local workers are offline. The local production environment polls durable intake and publishes via outbound authenticated connections.</desc>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#526984"/></marker></defs>
<style>.h-edge{fill:none;stroke:#526984;stroke-width:2;marker-end:url(#arrow2)}</style>
<rect width="1160" height="820" fill="white"/>
<rect x="25" y="30" width="420" height="525" rx="14" fill="#eff6ff" stroke="#9dbce0"/><text x="45" y="65" class="heading">LOCAL / PRODUCTION</text>
<rect class="box" x="55" y="105" width="360" height="110" rx="9"/><text x="72" y="135" class="title">Orchestrator + source agents</text><text x="72" y="164" class="sub">Source connectors → maintained stories</text><text x="72" y="190" class="sub">Reusable across towns / neighborhoods</text>
<rect class="box" x="55" y="265" width="360" height="110" rx="9"/><text x="72" y="295" class="title">Editorial modules + local AI</text><text x="72" y="324" class="sub">Plan → write → gate → assemble</text><text x="72" y="350" class="sub">Local reviewer handles exceptions</text><path class="h-edge" d="M235 215V265"/>
<rect class="store" x="55" y="425" width="360" height="100" rx="9"/><text x="72" y="455" class="title">Private production records</text><text x="72" y="485" class="sub">Evidence, drafts, job state + backups</text><path class="h-edge" d="M235 375V425"/>
<rect x="25" y="580" width="420" height="115" rx="14" fill="#f5f0fc" stroke="#bca7da"/><rect class="box" x="55" y="590" width="360" height="95" rx="9"/><text x="72" y="620" class="title">External model API (optional)</text><text x="72" y="650" class="sub">Hosted inference; outside local environment</text><path class="h-edge control" d="M95 375V400H40V637H55"/>
<text x="55" y="725" class="small">No inbound public access to local workers.</text><text x="55" y="750" class="small">Local outages delay production, not public access.</text>
<rect x="535" y="30" width="600" height="750" rx="14" fill="#edf9f2" stroke="#8ab89c"/><text x="555" y="65" class="heading">CLOUD / ALWAYS-ON PUBLIC PRODUCT</text>
<rect class="box" x="565" y="105" width="245" height="110" rx="9"/><text x="580" y="135" class="title">Release + publishing</text><text x="580" y="164" class="sub">Validate edition manifest</text><text x="580" y="190" class="sub">Version + activate release</text>
<rect class="box" x="850" y="105" width="255" height="110" rx="9"/><text x="865" y="135" class="title">Community websites</text><text x="865" y="164" class="sub">One edition per local area</text><text x="865" y="190" class="sub">Full stories + attribution</text><path class="h-edge" d="M810 160H850"/>
<path class="h-edge" d="M415 320H485V160H565"/><text x="452" y="240" class="small">Approved</text><text x="452" y="261" class="small">releases</text>
<rect class="box" x="565" y="285" width="245" height="110" rx="9"/><text x="580" y="315" class="title">Public intake API</text><text x="580" y="344" class="sub">Feedback + ad submissions</text><text x="580" y="370" class="sub">Abuse limits + validation</text>
<rect class="box" x="850" y="285" width="255" height="110" rx="9"/><text x="865" y="315" class="title">Public forms</text><text x="865" y="344" class="sub">Reactions / reporting issues</text><text x="865" y="370" class="sub">Advertiser intake</text><path class="h-edge" d="M977 215V285"/><path class="h-edge" d="M850 340H810"/>
<rect class="store" x="565" y="445" width="245" height="110" rx="9"/><text x="580" y="475" class="title">Durable public records</text><text x="580" y="504" class="sub">Intake, release / send state</text><text x="580" y="530" class="sub">Aggregate community signals</text><path class="h-edge" d="M687 395V445"/>
<path class="h-edge" d="M565 500H475V400H435V355H415"/><text x="448" y="550" class="small">Poll for</text><text x="448" y="571" class="small">pending work</text>
<rect class="box" x="850" y="445" width="255" height="110" rx="9"/><text x="865" y="475" class="title">Email provider</text><text x="865" y="504" class="sub">Consent + list membership</text><text x="865" y="530" class="sub">Suppression + unsubscribe</text>
<path class="h-edge" d="M800 215H830V500H850"/><text x="840" y="423" class="small">Preview after release verification</text>
<rect class="box" x="850" y="615" width="255" height="85" rx="9"/><text x="865" y="645" class="title">Reader email inbox</text><text x="865" y="674" class="sub">Preview → website</text><path class="h-edge" d="M977 555V615"/>
<rect class="box" x="565" y="615" width="245" height="85" rx="9"/><text x="580" y="645" class="title">External monitoring</text><text x="580" y="674" class="sub">Missed runs + public health</text>
<text x="565" y="740" class="small">Cloud services persist intake and accept unsubscribes</text><text x="565" y="762" class="small">even when production is offline. Email data is separate from analytics.</text>
</svg>