<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 910" role="img" aria-labelledby="services-title services-desc"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243146}.heading{font-size:22px;font-weight:700}.title{font-size:18px;font-weight:700}.sub{font-size:15px}.small{font-size:14px;fill:#54657b}.box{fill:white;stroke:#91a3ba;stroke-width:1.5}.store{fill:#fffaf0;stroke:#c79b45;stroke-width:1.5;stroke-dasharray:6 4}.edge{fill:none;stroke:#526984;stroke-width:2;marker-end:url(#arrow1)}.control{stroke-dasharray:6 4}</style>
<title id="services-title">Stage 3: cloud microservice architecture vision</title><desc id="services-desc">Separate ingestion and editorial orchestration drive source workers, story reconciliation, editorial services, and human exceptions through durable messaging. Approved releases reach publication and email services. Public, commercial, subscription and community-learning services have bounded ownership. A private operator and future partner portal uses scoped authorization.</desc>
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#526984"/></marker></defs>
<style>.s-edge{fill:none;stroke:#526984;stroke-width:2;marker-end:url(#arrow3)}</style>
<rect width="1160" height="910" fill="white"/>
<rect x="25" y="25" width="1110" height="275" rx="14" fill="#eff6ff" stroke="#9dbce0"/><text x="45" y="58" class="heading">DATA PLANE / INDEPENDENT ACQUISITION CADENCE</text>
<rect class="box" x="50" y="100" width="230" height="110" rx="9"/><text x="65" y="130" class="title">Ingestion orchestration</text><text x="65" y="159" class="sub">Schedule + source scope</text><text x="65" y="185" class="sub">Retries + run visibility</text>
<rect class="box" x="325" y="100" width="230" height="110" rx="9"/><text x="340" y="130" class="title">Source-worker pools</text><text x="340" y="159" class="sub">Source-specific connectors</text><text x="340" y="185" class="sub">Browser / HTTP workers</text>
<rect class="box" x="600" y="100" width="230" height="110" rx="9"/><text x="615" y="130" class="title">Story service</text><text x="615" y="159" class="sub">Reconcile + location map</text><text x="615" y="185" class="sub">Evidence + story versions</text>
<rect class="store" x="875" y="100" width="230" height="110" rx="9"/><text x="890" y="130" class="title">Story / evidence data</text><text x="890" y="159" class="sub">Owned relational records</text><text x="890" y="185" class="sub">Private object storage</text>
<path class="s-edge control" d="M280 155H325"/><path class="s-edge" d="M555 155H600"/><path class="s-edge" d="M830 155H875"/>
<rect x="50" y="240" width="1055" height="38" rx="7" fill="#dbeafe"/><text x="70" y="265" class="sub">Durable jobs / events: versioned contracts, bounded retries, quarantine, replay, backpressure</text>
<rect x="25" y="325" width="1110" height="310" rx="14" fill="#f5f0fc" stroke="#bca7da"/><text x="45" y="358" class="heading">EDITORIAL &amp; PUBLISHING / WEEKLY COMMUNITY WORKFLOWS</text>
<rect class="box" x="50" y="400" width="230" height="110" rx="9"/><text x="65" y="430" class="title">Edition orchestration</text><text x="65" y="459" class="sub">Planning + coverage rules</text><text x="65" y="485" class="sub">Per town / neighborhood</text>
<rect class="box" x="325" y="400" width="230" height="110" rx="9"/><text x="340" y="430" class="title">Editorial services</text><text x="340" y="459" class="sub">Writing + publication gate</text><text x="340" y="485" class="sub">Versioned decisions</text>
<rect class="box" x="600" y="400" width="230" height="110" rx="9"/><text x="615" y="430" class="title">Release / publication</text><text x="615" y="459" class="sub">Assembly + release state</text><text x="615" y="485" class="sub">Public content + corrections</text>
<rect class="box" x="875" y="400" width="230" height="110" rx="9"/><text x="890" y="430" class="title">Delivery service</text><text x="890" y="459" class="sub">Email preview campaigns</text><text x="890" y="485" class="sub">Provider + suppression</text>
<path class="s-edge" d="M715 210V310H35V385H165V400"/><path class="s-edge" d="M280 455H325"/><path class="s-edge" d="M555 455H600"/><path class="s-edge" d="M830 455H875"/>
<rect class="box" x="50" y="545" width="230" height="65" rx="9"/><text x="65" y="572" class="title">Scoped config + policies</text><text x="65" y="595" class="small">Central / bounded local controls</text>
<rect class="box" x="325" y="545" width="230" height="65" rx="9"/><text x="340" y="572" class="title">Human exception service</text><text x="340" y="595" class="small">Audits + review + corrections</text>
<rect class="box" x="600" y="545" width="230" height="65" rx="9"/><text x="615" y="572" class="title">Model gateway / runtime</text><text x="615" y="595" class="small">Budgets, routing, evaluation</text>
<rect class="box" x="875" y="545" width="230" height="65" rx="9"/><text x="890" y="572" class="title">Commercial service</text><text x="890" y="595" class="small">Eligible placements, not ranking</text>
<path class="s-edge" d="M440 510V545"/><path class="s-edge" d="M555 577H575V490H555"/><path class="s-edge" d="M715 545V530H525V510"/><path class="s-edge control" d="M165 545V510"/><path class="s-edge" d="M875 577H845V490H830"/>
<rect x="25" y="660" width="1110" height="185" rx="14" fill="#edf9f2" stroke="#8ab89c"/><text x="45" y="693" class="heading">PUBLIC &amp; OPERATOR EXPERIENCE / SCOPED ACCESS</text>
<rect class="box" x="50" y="725" width="230" height="90" rx="9"/><text x="65" y="754" class="title">Community websites</text><text x="65" y="782" class="sub">CDN + public content API</text>
<rect class="box" x="325" y="725" width="230" height="90" rx="9"/><text x="340" y="754" class="title">Feedback + learning</text><text x="340" y="782" class="sub">Aggregate topic adaptation</text>
<rect class="box" x="600" y="725" width="230" height="90" rx="9"/><text x="615" y="754" class="title">Subscription service</text><text x="615" y="782" class="sub">Consent + community lists</text>
<rect class="box" x="875" y="725" width="230" height="90" rx="9"/><text x="890" y="754" class="title">Operator / partner portal</text><text x="890" y="782" class="sub">Authenticated, scoped roles</text>
<path class="s-edge" d="M600 490H590V645H35V710H165V725"/><path class="s-edge control" d="M325 770H305V650H40V530H190V510"/><path class="s-edge" d="M830 770H850V525H990V510"/>
<text x="45" y="875" class="small">Shared foundations: identity + authorization / secrets / logs + traces / backups / alerts / deployment automation</text>
</svg>